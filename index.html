<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Master - Merge & Split</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .markdown-body table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        page-break-inside: auto;
      }
      .markdown-body tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
      .markdown-body th, .markdown-body td {
        border: 1px solid #e2e8f0;
        padding: 0.5rem;
        text-align: left;
      }
      .markdown-body th {
        background-color: #f1f5f9;
        font-weight: 600;
      }
      .markdown-body tr:nth-child(even) {
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .pdf-export-container {
        font-family: 'Inter', sans-serif;
        color: #1e293b;
        line-height: 1.6;
        padding: 40px;
        background: white;
      }
      .pdf-export-container h1, .pdf-export-container h2, .pdf-export-container h3 {
        color: #0f172a;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        font-weight: 700;
      }
      .pdf-export-container .markdown-body {
        margin-bottom: 2rem;
        font-size: 11pt;
      }
      .pdf-export-container table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1.5rem;
        page-break-inside: auto;
      }
      .pdf-export-container tr {
        page-break-inside: avoid;
      }
      .pdf-export-container th, .pdf-export-container td {
        border: 1px solid #e2e8f0;
        padding: 8px 12px;
        text-align: left;
      }
      .pdf-export-container th {
        background-color: #f8fafc;
        font-weight: 600;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Polyfill process for pdfjs-dist
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
      // Polyfill for Promise.withResolvers required by pdfjs-dist v4+
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function () {
          let resolve, reject;
          const promise = new Promise((res, rej) => {
            resolve = res;
            reject = rej;
          });
          return { promise, resolve, reject };
        };
      }
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
